[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-vision-worker"
version = "0.1.0"
description = "Computer vision worker for TrafficVision AI"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
traffic-vision-process = "vision_worker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vision_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"